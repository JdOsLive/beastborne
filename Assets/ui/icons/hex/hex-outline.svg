<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" version="1.1">
  <!-- Pointy-top hexagon outline. White stroke, no fill — so the hex-body's
       state-tinted background-color shows through the interior. The stroke
       is scaled with stroke-width 28 to read at 52-64px display sizes. -->
  <polygon
    points="256,16 485,136 485,376 256,496 27,376 27,136"
    fill="none"
    stroke="#ffffff"
    stroke-width="28"
    stroke-linejoin="round" />
</svg>
