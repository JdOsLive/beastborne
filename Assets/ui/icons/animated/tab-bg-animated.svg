<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 48" width="512" height="48">
  <defs>
    <radialGradient id="p1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="48" fill="transparent"/>

  <!-- All animations use values="A;B;A" so start=end, perfect loop -->
  <!-- All durations are 12s -->

  <!-- Large orbs -->
  <circle cx="60" cy="16" r="22" fill="url(#p1)">
    <animate attributeName="cx" values="60;450;60" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="16;32;16" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="400" cy="34" r="16" fill="url(#p2)">
    <animate attributeName="cx" values="400;100;400" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="34;14;34" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="24" r="18" fill="url(#p3)">
    <animate attributeName="cx" values="180;330;180" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="20;28;20" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Medium particles -->
  <circle cx="120" cy="10" r="10" fill="url(#p1)">
    <animate attributeName="cx" values="80;300;80" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="10;20;10" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="350" cy="38" r="12" fill="url(#p2)">
    <animate attributeName="cx" values="380;200;380" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="38;28;38" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Sparkles with opacity pulse -->
  <circle cx="150" cy="12" r="3" fill="#c4b5fd">
    <animate attributeName="cx" values="100;250;100" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="10;18;10" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.45;0.1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="36" r="2.5" fill="#c4b5fd">
    <animate attributeName="cx" values="420;280;420" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="38;30;38" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.05;0.35;0.05" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="256" cy="24" r="2" fill="#a78bfa">
    <animate attributeName="cx" values="200;320;200" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="22;28;22" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Light streaks -->
  <rect x="100" y="23" width="70" height="1.5" rx="0.75" fill="#7c3aed">
    <animate attributeName="x" values="50;400;50" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.05;0.2;0.05" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect x="300" y="28" width="50" height="1" rx="0.5" fill="#a78bfa">
    <animate attributeName="x" values="350;120;350" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.03;0.15;0.03" dur="12s" repeatCount="indefinite"/>
  </rect>
</svg>