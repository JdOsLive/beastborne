<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 48" width="512" height="48">
  <defs>
    <radialGradient id="p1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="48" fill="transparent"/>

  <!-- All use alternate direction so they drift back and forth — no teleport -->

  <!-- Large orbs drifting -->
  <circle cx="60" cy="16" r="22" fill="url(#p1)">
    <animate attributeName="cx" from="60" to="450" dur="6s" repeatCount="indefinite" direction="alternate"/>
    <animate attributeName="cy" from="16" to="32" dur="6s" repeatCount="indefinite" direction="alternate"/>
  </circle>
  <circle cx="400" cy="34" r="16" fill="url(#p2)">
    <animate attributeName="cx" from="400" to="100" dur="6s" repeatCount="indefinite" direction="alternate"/>
    <animate attributeName="cy" from="34" to="14" dur="6s" repeatCount="indefinite" direction="alternate"/>
  </circle>
  <circle cx="256" cy="24" r="18" fill="url(#p3)">
    <animate attributeName="cx" from="180" to="330" dur="6s" repeatCount="indefinite" direction="alternate"/>
    <animate attributeName="cy" from="20" to="28" dur="6s" repeatCount="indefinite" direction="alternate"/>
  </circle>

  <!-- Medium particles -->
  <circle cx="120" cy="10" r="10" fill="url(#p1)">
    <animate attributeName="cx" from="80" to="300" dur="6s" repeatCount="indefinite" direction="alternate"/>
    <animate attributeName="cy" from="10" to="20" dur="6s" repeatCount="indefinite" direction="alternate"/>
  </circle>
  <circle cx="350" cy="38" r="12" fill="url(#p2)">
    <animate attributeName="cx" from="380" to="200" dur="6s" repeatCount="indefinite" direction="alternate"/>
    <animate attributeName="cy" from="38" to="28" dur="6s" repeatCount="indefinite" direction="alternate"/>
  </circle>

  <!-- Small sparkles with opacity pulse -->
  <circle cx="150" cy="12" r="3" fill="#c4b5fd">
    <animate attributeName="cx" from="100" to="250" dur="6s" repeatCount="indefinite" direction="alternate"/>
    <animate attributeName="cy" from="10" to="18" dur="6s" repeatCount="indefinite" direction="alternate"/>
    <animate attributeName="opacity" from="0.1" to="0.45" dur="6s" repeatCount="indefinite" direction="alternate"/>
  </circle>
  <circle cx="380" cy="36" r="2.5" fill="#c4b5fd">
    <animate attributeName="cx" from="420" to="280" dur="6s" repeatCount="indefinite" direction="alternate"/>
    <animate attributeName="cy" from="38" to="30" dur="6s" repeatCount="indefinite" direction="alternate"/>
    <animate attributeName="opacity" from="0.05" to="0.35" dur="6s" repeatCount="indefinite" direction="alternate"/>
  </circle>
  <circle cx="256" cy="24" r="2" fill="#a78bfa">
    <animate attributeName="cx" from="200" to="320" dur="6s" repeatCount="indefinite" direction="alternate"/>
    <animate attributeName="cy" from="22" to="28" dur="6s" repeatCount="indefinite" direction="alternate"/>
    <animate attributeName="opacity" from="0.1" to="0.4" dur="6s" repeatCount="indefinite" direction="alternate"/>
  </circle>

  <!-- Light streaks -->
  <rect x="100" y="23" width="70" height="1.5" rx="0.75" fill="#7c3aed">
    <animate attributeName="x" from="50" to="400" dur="6s" repeatCount="indefinite" direction="alternate"/>
    <animate attributeName="opacity" from="0.05" to="0.2" dur="6s" repeatCount="indefinite" direction="alternate"/>
  </rect>
  <rect x="300" y="28" width="50" height="1" rx="0.5" fill="#a78bfa">
    <animate attributeName="x" from="350" to="120" dur="6s" repeatCount="indefinite" direction="alternate"/>
    <animate attributeName="opacity" from="0.03" to="0.15" dur="6s" repeatCount="indefinite" direction="alternate"/>
  </rect>
</svg>