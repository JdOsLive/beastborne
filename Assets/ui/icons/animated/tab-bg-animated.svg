<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 48" width="512" height="48">
  <defs>
    <radialGradient id="p1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="48" fill="transparent"/>

  <!-- All animations use 3s duration for perfect loop -->

  <!-- Drifting orbs -->
  <circle r="22" fill="url(#p1)">
    <animate attributeName="cx" from="-30" to="542" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="14;22;14" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="16" fill="url(#p2)">
    <animate attributeName="cx" from="542" to="-30" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="34;26;34" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="18" fill="url(#p3)">
    <animate attributeName="cx" from="170" to="742" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="24;18;24" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="14" fill="url(#p1)">
    <animate attributeName="cx" from="340" to="912" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="30;38;30" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Smaller particles -->
  <circle r="8" fill="url(#p2)">
    <animate attributeName="cx" from="-10" to="562" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="10;15;10" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="10" fill="url(#p3)">
    <animate attributeName="cx" from="256" to="828" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="38;32;38" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Sparkles -->
  <circle r="3" fill="#c4b5fd">
    <animate attributeName="cx" from="50" to="622" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="8;14;8" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.45;0.1" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#c4b5fd">
    <animate attributeName="cx" from="400" to="972" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="40;34;40" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.05;0.35;0.05" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#a78bfa">
    <animate attributeName="cx" from="200" to="772" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="20;26;20" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="12s" repeatCount="indefinite"/>
  </circle>

  <!-- Light streaks -->
  <rect y="23" width="70" height="1.5" rx="0.75" fill="#7c3aed">
    <animate attributeName="x" from="-80" to="592" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.2;0" dur="12s" repeatCount="indefinite"/>
  </rect>
  <rect y="28" width="50" height="1" rx="0.5" fill="#a78bfa">
    <animate attributeName="x" from="150" to="722" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.15;0" dur="12s" repeatCount="indefinite"/>
  </rect>
</svg>