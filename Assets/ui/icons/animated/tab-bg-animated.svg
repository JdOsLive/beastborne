<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 48" width="512" height="48">
  <defs>
    <radialGradient id="p1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="48" fill="transparent"/>

  <!-- Slow drifting particles - layer 1 -->
  <circle r="20" fill="url(#p1)">
    <animate attributeName="cx" from="-20" to="532" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="14;20;14" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle r="15" fill="url(#p2)">
    <animate attributeName="cx" from="-40" to="552" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="30;24;30" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle r="18" fill="url(#p3)">
    <animate attributeName="cx" from="-60" to="572" dur="12s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="22;28;22" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Layer 2 - smaller, faster -->
  <circle r="8" fill="url(#p1)">
    <animate attributeName="cx" from="-10" to="522" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="10;16;10" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle r="10" fill="url(#p2)">
    <animate attributeName="cx" from="-30" to="542" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="36;30;36" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="6" fill="url(#p3)">
    <animate attributeName="cx" from="-50" to="562" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="24;18;24" dur="1.8s" repeatCount="indefinite"/>
  </circle>

  <!-- Layer 3 - tiny sparkles -->
  <circle r="3" fill="#c4b5fd" opacity="0.3">
    <animate attributeName="cx" from="-5" to="517" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="8;12;8" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle r="2" fill="#c4b5fd" opacity="0.2">
    <animate attributeName="cx" from="-20" to="532" dur="5.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="38;34;38" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.05;0.3;0.05" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#a78bfa" opacity="0.25">
    <animate attributeName="cx" from="-35" to="547" dur="6.5s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="20;26;20" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.35;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Subtle horizontal light streak -->
  <rect x="-100" y="22" width="80" height="2" rx="1" fill="#7c3aed" opacity="0.15">
    <animate attributeName="x" from="-100" to="612" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.2;0" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="-150" y="26" width="60" height="1" rx="0.5" fill="#a78bfa" opacity="0.1">
    <animate attributeName="x" from="-150" to="662" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.15;0" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>