<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 48" width="512" height="48">
  <defs>
    <radialGradient id="p1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="p3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <!-- Clip to viewport -->
    <clipPath id="vp"><rect x="0" y="0" width="512" height="48"/></clipPath>
  </defs>

  <rect width="512" height="48" fill="transparent"/>

  <!-- Scrolling group: translates left by 512px over 12s, then loops perfectly -->
  <!-- All particles are placed twice: at X and at X+512 -->
  <g clip-path="url(#vp)">
    <g>
      <animateTransform attributeName="transform" type="translate"
        from="0,0" to="-512,0" dur="12s" repeatCount="indefinite"/>

      <!-- Large orbs (originals) -->
      <circle cx="80" r="22" fill="url(#p1)">
        <animate attributeName="cy" values="16;30;16" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="250" r="18" fill="url(#p2)">
        <animate attributeName="cy" values="32;18;32" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="420" r="16" fill="url(#p3)">
        <animate attributeName="cy" values="12;26;12" dur="12s" repeatCount="indefinite"/>
      </circle>

      <!-- Medium particles (originals) -->
      <circle cx="160" r="10" fill="url(#p1)">
        <animate attributeName="cy" values="38;28;38" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="350" r="12" fill="url(#p2)">
        <animate attributeName="cy" values="10;22;10" dur="12s" repeatCount="indefinite"/>
      </circle>

      <!-- Sparkles (originals) -->
      <circle cx="50" r="3" fill="#c4b5fd">
        <animate attributeName="cy" values="8;16;8" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.4;0.1" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="200" r="2.5" fill="#c4b5fd">
        <animate attributeName="cy" values="40;32;40" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.05;0.35;0.05" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="470" r="2" fill="#a78bfa">
        <animate attributeName="cy" values="24;18;24" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.4;0.1" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="310" r="2" fill="#c4b5fd">
        <animate attributeName="cy" values="6;14;6" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.08;0.3;0.08" dur="12s" repeatCount="indefinite"/>
      </circle>

      <!-- Light streak (original) -->
      <rect x="120" y="23" width="60" height="1.5" rx="0.75" fill="#7c3aed">
        <animate attributeName="opacity" values="0.05;0.18;0.05" dur="12s" repeatCount="indefinite"/>
      </rect>

      <!-- ===== DUPLICATES offset by +512 ===== -->

      <!-- Large orbs (duplicates) -->
      <circle cx="592" r="22" fill="url(#p1)">
        <animate attributeName="cy" values="16;30;16" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="762" r="18" fill="url(#p2)">
        <animate attributeName="cy" values="32;18;32" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="932" r="16" fill="url(#p3)">
        <animate attributeName="cy" values="12;26;12" dur="12s" repeatCount="indefinite"/>
      </circle>

      <!-- Medium particles (duplicates) -->
      <circle cx="672" r="10" fill="url(#p1)">
        <animate attributeName="cy" values="38;28;38" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="862" r="12" fill="url(#p2)">
        <animate attributeName="cy" values="10;22;10" dur="12s" repeatCount="indefinite"/>
      </circle>

      <!-- Sparkles (duplicates) -->
      <circle cx="562" r="3" fill="#c4b5fd">
        <animate attributeName="cy" values="8;16;8" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.4;0.1" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="712" r="2.5" fill="#c4b5fd">
        <animate attributeName="cy" values="40;32;40" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.05;0.35;0.05" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="982" r="2" fill="#a78bfa">
        <animate attributeName="cy" values="24;18;24" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.1;0.4;0.1" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle cx="822" r="2" fill="#c4b5fd">
        <animate attributeName="cy" values="6;14;6" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.08;0.3;0.08" dur="12s" repeatCount="indefinite"/>
      </circle>

      <!-- Light streak (duplicate) -->
      <rect x="632" y="23" width="60" height="1.5" rx="0.75" fill="#7c3aed">
        <animate attributeName="opacity" values="0.05;0.18;0.05" dur="12s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>
</svg>