<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <style>
    .bell{animation:al-swing 1.5s ease-in-out infinite;transform-origin:24px 8px}
    @keyframes al-swing{0%{transform:rotate(0)}8%{transform:rotate(9deg)}18%{transform:rotate(-7deg)}28%{transform:rotate(4deg)}38%{transform:rotate(-1.5deg)}46%,100%{transform:rotate(0)}}
    .clap{animation:al-lag 1.5s ease-in-out infinite;transform-origin:24px 8px}
    @keyframes al-lag{0%{transform:rotate(0)}12%{transform:rotate(-12deg)}22%{transform:rotate(9deg)}32%{transform:rotate(-5deg)}42%{transform:rotate(2deg)}50%,100%{transform:rotate(0)}}
  </style>
  <g class="bell" fill="#ffffff">
    <circle cx="24" cy="10.4" r="2.3"></circle>
    <path d="M13.2 29.4c1.5-1.8 2.4-4 2.4-7.6C15.6 14.6 19 10 24 10s8.4 4.6 8.4 11.8c0 3.6.9 5.8 2.4 7.6q1.1 1.4-.6 1.4H13.8q-1.7 0-.6-1.4Z"></path>
  </g>
  <circle class="clap" cx="24" cy="35.3" r="3" fill="#ffffff"></circle>
</svg>
