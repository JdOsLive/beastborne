<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Persona 5 stamp dialect: bold black outline + nested angular fire colors. -->
  <!-- All flame layers share the same triangular-tongue topology, just inset. -->

  <!-- Outer dark-red silhouette + heavy ink stroke (the stamp). -->
  <path fill="#9a1818" stroke="#0a0612" stroke-width="6" stroke-linejoin="miter" stroke-linecap="butt"
        d="M 100 198 L 22 198 L 32 150 L 14 110 L 40 108 L 22 70 L 56 82 L 36 38 L 76 64 L 60 8 L 100 56 L 140 8 L 124 64 L 164 38 L 144 82 L 178 70 L 160 108 L 186 110 L 168 150 L 178 198 Z"/>

  <!-- Mid orange flame, inset ~10px from each edge. -->
  <path fill="#e84a18"
        d="M 100 188 L 38 188 L 46 150 L 32 118 L 52 116 L 38 84 L 66 94 L 50 56 L 84 76 L 70 28 L 100 68 L 130 28 L 116 76 L 150 56 L 134 94 L 162 84 L 148 116 L 168 118 L 154 150 L 162 188 Z"/>

  <!-- Inner bright orange. -->
  <path fill="#ff8a1c"
        d="M 100 178 L 56 178 L 60 145 L 50 122 L 65 122 L 54 96 L 76 104 L 64 72 L 90 90 L 80 48 L 100 80 L 120 48 L 110 90 L 136 72 L 124 104 L 146 96 L 135 122 L 150 122 L 140 145 L 144 178 Z"/>

  <!-- Hot yellow core. -->
  <path fill="#ffd23a"
        d="M 100 168 L 72 168 L 74 142 L 68 124 L 80 126 L 72 105 L 88 110 L 80 85 L 95 100 L 90 65 L 100 92 L 110 65 L 105 100 L 120 85 L 112 110 L 128 105 L 120 126 L 132 124 L 126 142 L 128 168 Z"/>

  <!-- White-hot pip at the bottom — ground of the flame. -->
  <ellipse cx="100" cy="155" rx="14" ry="16" fill="#ffffff" opacity="0.55"/>
</svg>
