<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Beastborne — Stat Row (sb-row)</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,900&display=swap" rel="stylesheet">
<!--
  ENGINE NOTES:
  · IN-ENGINE: repeating-linear-gradient is UNSUPPORTED — the hatch is a baked 9px-period vertical
    stripe PNG (ui/gauge-stripe.png) on the fill; the bar's skewX(-23°) shears the verticals to ~113°.
    Here it's a real repeating-linear-gradient of vertical stripes inside the same skew — identical render.
  · The FILL is EXPLICIT PX in-engine (270 × pct/100 from C#) — a % width under a transformed ancestor
    is derived-width poison. Width transition 0.4s cubic-bezier(0.4,0,0.2,1) re-tweens on beast switch.
  · Row math (scroll-column recipe, all explicit): 42 label + 46 gene + 270 bar + 62 value + 36 boost
    + 4×12 gaps = 504 inner.
  · Boost slot ALWAYS renders (36px) so the value column stays aligned; the chip only mounts when a
    veteran bonus exists.
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0712;font-family:'Exo 2',system-ui,sans-serif;color:#f4f1ea;padding:36px 40px}
h1{font-style:italic;font-weight:900;font-size:24px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.sub{font-size:12px;font-weight:500;color:#A79DBE;margin-bottom:26px}
.stage{background:#130E1D;padding:28px;border-radius:8px;max-width:600px}
.row{display:flex;align-items:center;gap:12px;height:24px;margin-bottom:13px}
.row:last-child{margin-bottom:0}
.lb{width:42px;flex:0 0 42px;font-style:italic;font-size:13px;font-weight:700;letter-spacing:1px;line-height:16px}
.gn{width:46px;flex:0 0 46px;font-size:11px;font-weight:500;color:#7C7295;line-height:14px}
.bar{width:270px;flex:0 0 270px;height:7px;background:#221B33;transform:skewX(-23deg);display:flex}
.fill{height:7px;background-image:repeating-linear-gradient(90deg,rgba(10,7,18,.35) 0 3px,rgba(0,0,0,0) 3px 9px);transition:width .4s cubic-bezier(.4,0,.2,1)}
.vl{width:62px;flex:0 0 62px;text-align:right;font-style:italic;font-size:20px;font-weight:700;color:#EFEAF7;line-height:24px}
.bs{width:36px;flex:0 0 36px;height:20px;display:flex;align-items:center;justify-content:center}
.bchip{width:36px;height:18px;display:flex;align-items:center;justify-content:center;background:rgba(74,222,128,.1);transform:skewX(-12deg);border-radius:3px}
.bchip span{transform:skewX(12deg);font-size:11px;font-weight:600;color:#4ADE80;line-height:13px}
</style></head><body>
<h1>Stat Row — .sb-row</h1>
<div class="sub">Italic colored label · gene fraction · skewed striped parallelogram gauge · big italic value · +N veteran chip. Six rows, one ledger.</div>
<div class="stage">
  <div class="row"><span class="lb" style="color:#4ADE80">HP</span><span class="gn">28/30</span><div class="bar"><div class="fill" style="width:84%;background-color:#4ADE80"></div></div><span class="vl">247</span><div class="bs"><div class="bchip"><span>+12</span></div></div></div>
  <div class="row"><span class="lb" style="color:#F87171">ATK</span><span class="gn">22/30</span><div class="bar"><div class="fill" style="width:66%;background-color:#F87171"></div></div><span class="vl">183</span><div class="bs"></div></div>
  <div class="row"><span class="lb" style="color:#60A5FA">DEF</span><span class="gn">17/30</span><div class="bar"><div class="fill" style="width:48%;background-color:#60A5FA"></div></div><span class="vl">141</span><div class="bs"></div></div>
  <div class="row"><span class="lb" style="color:#C084FC">SP.A</span><span class="gn">26/30</span><div class="bar"><div class="fill" style="width:76%;background-color:#C084FC"></div></div><span class="vl">209</span><div class="bs"><div class="bchip"><span>+8</span></div></div></div>
  <div class="row"><span class="lb" style="color:#2DD4BF">SP.D</span><span class="gn">14/30</span><div class="bar"><div class="fill" style="width:39%;background-color:#2DD4BF"></div></div><span class="vl">118</span><div class="bs"></div></div>
  <div class="row"><span class="lb" style="color:#FBBF24">SPD</span><span class="gn">30/30</span><div class="bar"><div class="fill" style="width:93%;background-color:#FBBF24"></div></div><span class="vl">264</span><div class="bs"></div></div>
</div>
</body></html>
