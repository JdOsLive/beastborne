<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Beastborne — Roster Grid Card</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,900&display=swap" rel="stylesheet">
<!--
  ENGINE NOTES (MonsterCard .mini, 150×180):
  · Shell: r22, gradient #1c1830→#141021, static dark drop 0 4px 14px rgba(0,0,0,.45) — the shadow NEVER
    changes with state (scroll-leak discipline). Hover: bg only (#251e40→#191329) — in roster, hovering
    MOVES the selection and the liquid ring is the feedback (one-cursor). Selected: 2px #9b6cff border +
    #2b2250→#1d1738 + the external grid-ring (see cursor card).
  · Badges pinned INSIDE bounds (top/right 8px — overhang leaks past scroll clips): LV + genes pills are
    skewX(-8°) dark slabs rgba(8,6,16,.94), quality carried by TEXT color only (no colored borders/glows).
  · Sprite: image-rendering pixelated, per-species scale/offset from C#, bottom fade into the nameplate.
  · Rarity = the skewed pedestal strip (60×4, skewX(-18°), centered above the nameplate) — never a
    card-wide border or element flood (guiding-star).
  · No HP sliver on the shipped mini card — vitality lives on the stage XP gauge; noted for the mock docs.
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0712;font-family:'Exo 2',system-ui,sans-serif;color:#f4f1ea;padding:36px 40px}
h1{font-style:italic;font-weight:900;font-size:24px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.sub{font-size:12px;font-weight:500;color:#A79DBE;margin-bottom:26px}
.stage{background:#130E1D;padding:40px 34px;border-radius:8px;display:flex;gap:44px;flex-wrap:wrap}
.wrap{position:relative;width:150px}
.card{position:relative;width:150px;height:180px;border-radius:22px;border:2px solid rgba(0,0,0,0);background:linear-gradient(to bottom,#1c1830 0%,#141021 100%);box-shadow:0 4px 14px rgba(0,0,0,.45);cursor:pointer;transition:border-color .16s ease}
.card:hover{background:linear-gradient(to bottom,#251e40 0%,#191329 100%)}
.card.selected{border-color:#9b6cff;background:linear-gradient(to bottom,#2b2250 0%,#1d1738 100%)}
.spr{position:absolute;top:0;left:0;right:0;bottom:30px;border-radius:20px 20px 0 0;overflow:hidden;display:flex;align-items:center;justify-content:center}
.blob{width:86px;height:96px;margin-top:6px;border-radius:52% 48% 46% 54%/60% 58% 42% 40%}
.fade{position:absolute;left:0;right:0;bottom:30px;height:36px;background:linear-gradient(to bottom,rgba(20,16,33,0) 0%,rgba(20,16,33,.55) 55%,rgba(20,16,33,.95) 100%);z-index:1}
.badges{position:absolute;top:8px;left:8px;display:flex;gap:5px;z-index:3}
.pill{background:rgba(8,6,16,.94);border-radius:5px;padding:3px 9px;transform:skewX(-8deg);font-size:11px;font-weight:800;letter-spacing:.6px;line-height:12px;white-space:nowrap}
.pill.lv{color:#f4f1ea}
.pill.gen{padding:3px 8px;color:#c084fc}
.fav{position:absolute;top:8px;right:8px;z-index:4;background:rgba(8,6,16,.94);border-radius:8px;padding:4px;display:flex}
.ped{position:absolute;bottom:38px;left:45px;width:60px;height:4px;border-radius:2px;transform:skewX(-18deg);opacity:.95;z-index:2}
.name{position:absolute;bottom:0;left:0;right:0;height:34px;background:rgba(10,8,18,.94);border-radius:0 0 20px 20px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.eltile{width:24px;height:24px;border-radius:7px;background:#262040;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.eltile.sec{width:21px;height:21px}
.nm{font-style:italic;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:#f4f1ea;line-height:14px;white-space:nowrap;overflow:hidden}
.ring{position:absolute;top:-12px;left:-12px;width:174px;height:204px;border:4px solid #9b6cff;border-radius:32px;pointer-events:none;z-index:5;animation:wave 3.4s ease-in-out infinite}
@keyframes wave{0%,100%{transform:skewX(0) rotate(0)}30%{transform:skewX(1.1deg) rotate(.45deg)}65%{transform:skewX(-.8deg) rotate(-.35deg)}}
.cap{position:absolute;bottom:-26px;width:100%;text-align:center;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#7C7295}
</style></head><body>
<h1>Roster Grid Card</h1>
<div class="sub">The collection atom: dark shell, badges inside bounds, rarity pedestal, nameplate with element tiles. Selection = the living ring, not a card glow.</div>
<div class="stage">
  <div class="wrap">
    <div class="card">
      <div class="spr"><div class="blob" style="background:radial-gradient(circle at 42% 34%,#3a8a80 0%,#16403c 66%,#0f2d2a 100%)"></div></div>
      <div class="fade"></div>
      <div class="badges"><span class="pill lv">LV 24</span><span class="pill gen">128</span></div>
      <div class="fav"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="rgba(214,206,236,.4)" stroke-width="2"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.12 2.12 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.12 2.12 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.12 2.12 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.12 2.12 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.12 2.12 0 0 0 1.597-1.16z"/></svg></div>
      <div class="ped" style="background:#3b82f6"></div>
      <div class="name"><div class="eltile"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2dd4bf" stroke-width="2"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 14 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg></div><span class="nm">GUSTWING</span></div>
    </div>
    <div class="cap">REST · RARE</div>
  </div>

  <div class="wrap">
    <div class="card selected">
      <div class="spr"><div class="blob" style="background:radial-gradient(circle at 42% 34%,#8a4030 0%,#4a1c12 66%,#33130c 100%)"></div></div>
      <div class="fade"></div>
      <div class="badges"><span class="pill lv">LV 31</span><span class="pill gen" style="color:#ffce3a">171</span></div>
      <div class="fav"><svg width="14" height="14" viewBox="0 0 24 24" fill="#ffce3a"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.12 2.12 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.12 2.12 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.12 2.12 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.12 2.12 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.12 2.12 0 0 0 1.597-1.16z"/></svg></div>
      <div class="ped" style="background:#fbbf24"></div>
      <div class="name"><div class="eltile"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#ff6a3d" stroke-width="2"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg></div><div class="eltile sec"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#c3cdd9" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/></svg></div><span class="nm">EMBERWHELP</span></div>
    </div>
    <div class="ring"></div>
    <div class="cap">SELECTED · LEGENDARY</div>
  </div>
</div>
</body></html>
