<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Beastborne — Element Dais</title>
<link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700;1,900&display=swap" rel="stylesheet">
<!--
  ENGINE NOTES:
  · IN-ENGINE the dais is a BAKED PNG per element (Assets/ui/dais/dais-<el>.png, 600×148 @2x,
    displayed 300×74): elliptical platter wash (center 0.28 → 0.06 @60% → 0 @78%) + 0.22 rim +
    a 210×48 inner ring at 0.14 — all in one image. s&box CANNOT draw this (live-verified):
    border-radius:50% on a wide-short div caps at a stadium pill, and percent-stop radials paint
    near-solid. Browser ellipse radial-gradients ARE faithful here.
  · Tier-1 ambient: the stage light BREATHES — opacity 1 ↔ 0.82, 5.4s ease-in-out infinite
    (opacity-only; never filter — filters rasterize pixel art). On beast switch a second stacked
    copy plays a one-shot flare (0.55 → 0, 0.55s).
  · Geometry: platter 300×74 near the portrait's feet — grounded beasts stand ON its center line.
  · Tints follow the beast's PRIMARY element (BbTokens v1 rims shown).
-->
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0712;font-family:'Exo 2',system-ui,sans-serif;color:#f4f1ea;padding:36px 40px}
h1{font-style:italic;font-weight:900;font-size:24px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px}
.sub{font-size:12px;font-weight:500;color:#A79DBE;margin-bottom:26px}
.stage{background:linear-gradient(to bottom,rgba(21,18,31,.99) 0%,rgba(13,10,24,.99) 100%);border-radius:26px;padding:30px 20px 42px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.spot{position:relative;width:320px;height:230px;display:flex;flex-direction:column;align-items:center}
.blob{position:relative;z-index:2;width:110px;height:120px;margin-top:14px;border-radius:52% 48% 46% 54%/60% 58% 42% 40%;opacity:.92}
.dais{position:absolute;left:10px;bottom:24px;width:300px;height:74px;animation:breathe 5.4s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.82}}
.wash{position:absolute;inset:0}
.ring{position:absolute;left:45px;top:13px;width:210px;height:48px;border-radius:50%;border:1px solid}
.nm{position:absolute;bottom:-4px;width:100%;text-align:center;font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:#7C7295}
</style></head><body>
<h1>The Element Dais</h1>
<div class="sub">The beast stands ON an elliptical stage light tinted by its primary element — platter wash + rim + inner ring, breathing at 5.4s. Felt, not seen.</div>

      <div class="wash" style="background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(255,106,61,.28) 0%,rgba(255,106,61,.06) 60%,rgba(255,106,61,0) 78%)"></div>
      <div class="ring" style="border-color:rgba(255,106,61,.14)"></div>
    </div>

  </div>
  <div class="spot">

      <div class="wash" style="background:radial-gradient(ellipse 50% 50% at 50% 50%,rgba(74,168,255,.28) 0%,rgba(74,168,255,.06) 60%,rgba(74,168,255,0) 78%)"></div>
      <div class="ring" style="border-color:rgba(74,168,255,.14)"></div>

      <div class="ring" style="border-color:rgba(194,107,255,.14)"></div>
